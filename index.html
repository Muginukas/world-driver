<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Driver — Lietuva</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="map"></div>

<!-- First-person hands HUD (walking mode) -->
<div id="hands-hud" class="hidden">
  <div class="hand hand-left"></div>
  <div class="hand hand-right"></div>
</div>

<!-- Driving HUD -->
<div id="drive-hud" class="hidden">
  <div id="speedometer"><span id="speed-value">0</span> km/h</div>
</div>

<!-- Interaction prompt (e.g. "Paspausk E - įlipti į mašiną") -->
<div id="prompt" class="hidden"></div>

<!-- Top info bar -->
<div id="topbar">
  <span id="mode-label">Vaikščiojimas</span>
  <span id="help-label">WASD/rodyklės — judėti · E — įlipti/išlipti</span>
</div>

<!-- Intro overlay -->
<div id="setup-overlay">
  <div class="setup-box">
    <h1>World Driver</h1>
    <p>Žaidimas ant tikro Vilniaus žemėlapio (OpenStreetMap). Vaikščiok, priėjęs
       prie bet kurios mašinos paspausk <b>E</b> ir vairuok — mieste nuolat važinėja eismas.</p>
    <p><b>WASD / rodyklės</b> — judėti, vairuoti &nbsp;·&nbsp; <b>E</b> — įlipti / išlipti</p>
    <button id="start-btn">Žaisti</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="js/geo.js"></script>
<script src="js/routes.js"></script>
<script src="js/vehicles.js"></script>
<script src="js/player.js"></script>
<script src="js/hud.js"></script>
<script src="js/main.js"></script>
</body>
</html>
